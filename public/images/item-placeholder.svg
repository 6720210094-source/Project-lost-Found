<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Item placeholder</title>
  <desc id="desc">A placeholder bag illustration for missing or found item images.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <g transform="translate(180 110)">
    <rect x="100" y="40" width="240" height="300" rx="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="8"/>
    <path d="M160 80 C170 20, 260 20, 270 80" fill="none" stroke="#94A3B8" stroke-width="14" stroke-linecap="round"/>
    <path d="M120 160 L260 160" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 220 L260 220" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 280 L260 280" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="220" cy="120" r="20" fill="#CBD5E1"/>
  </g>
  <text x="400" y="520" text-anchor="middle" font-size="36" font-family="Arial, sans-serif" fill="#475569">No image available</text>
</svg>
